# cargo-deny policy (threat 17: supply chain). Run with `cargo deny check`.

[graph]
all-features = false

[advisories]
# Any RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails the check.
# Accepted exceptions go in `ignore` with the advisory ID and a reason.
yanked = "deny"
ignore = [
    # proc-macro-error is unmaintained; pulled in at compile time only, by glib-macros in
    # Tauri's Linux GTK3 stack (gtk-rs 0.18). No runtime code, no fix until Tauri leaves GTK3.
    { id = "RUSTSEC-2024-0370", reason = "build-time proc-macro in Tauri's Linux GTK3 stack; no upstream fix" },
    # zvariant, zvariant_derive and zbus_names were folded back into zbus and are no longer
    # published separately. Not a vulnerability. Reached only through
    # tauri-plugin-single-instance's Linux D-Bus backend; never compiled into the Windows app.
    { id = "RUSTSEC-2026-0370", reason = "zvariant folded into zbus; Linux-only, single-instance plugin" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names folded into zbus; Linux-only, single-instance plugin" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive folded into zbus; Linux-only, single-instance plugin" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git dependencies or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
